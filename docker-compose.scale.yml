version: '3.8'

services:
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crbs-backend-1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - INSTANCE_ID=backend-instance-1
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ./backend/.env
    ports:
      - "5001:5000"
    restart: unless-stopped

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crbs-backend-2
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - INSTANCE_ID=backend-instance-2
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ./backend/.env
    ports:
      - "5002:5000"
    restart: unless-stopped

  backend-3:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crbs-backend-3
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - INSTANCE_ID=backend-instance-3
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ./backend/.env
    ports:
      - "5003:5000"
    restart: unless-stopped

  nginx-lb:
    image: nginx:alpine
    container_name: crbs-nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped
