# Nginx Load Balancer Configuration for 3 Backend Instances
# BACSE344 - Digital Assignment 3

upstream backend_cluster {
    # Round-Robin distribution across 3 backend instances
    server backend-1:5000 max_fails=2 fail_timeout=5s;
    server backend-2:5000 max_fails=2 fail_timeout=5s;
    server backend-3:5000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Load-balanced API routing with zero-downtime failover
    location /api/ {
        proxy_pass http://backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Automatic failover retry if an instance dies (Q1.c requirement)
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
    }

    # Static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }
}
