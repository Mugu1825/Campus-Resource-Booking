<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Register - CRBS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <h2 class="text-center mb-4">Staff Registration</h2>
      <div id="register-alert"></div>
      <form id="register-staff-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Department</label>
          <select id="department" class="form-control" required>
            <option value="">Select Department</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="MEE">MEE</option>
            <option value="INT">INT</option>
            <option value="CIV">CIV</option>
            <option value="CHE">CHE</option>
            <option value="AER">AER</option>
            <option value="BIO">BIO</option>
            <option value="MBA">MBA</option>
            <option value="MCA">MCA</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" minlength="8" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm_password" class="form-control" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4" id="register-btn">Register</button>
      </form>
      <div class="text-center mt-4">
        <a href="login.html">Already have an account? Login</a>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
