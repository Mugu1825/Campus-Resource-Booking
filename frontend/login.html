<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - CRBS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <h2 class="text-center mb-4">Login to CRBS</h2>
      <div id="login-alert"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4" id="login-btn">Login</button>
      </form>
      <div class="text-center mt-4">
        <p>Don't have an account?</p>
        <div class="mt-2">
          <a href="register-student.html">Student Register</a> | <a href="register-staff.html">Staff Register</a>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
